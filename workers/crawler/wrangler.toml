name = "croche-search-crawler"
main = "worker.js"
compatibility_date = "2025-09-01"

# Cada disparo processa UMA query da fila (ver worker.js) - a cada 2 minutos
# dá pra girar um lote de 5 queries em ~10 minutos. Ajuste conforme sua
# cota do ValueSerp e a frequencia que fizer sentido.
[triggers]
crons = ["*/2 * * * *"]

# Mesma base D1 já usada pela API (tutoriais-croche).
# Binding nativo: consultas rodam dentro da rede da Cloudflare,
# sem o round-trip HTTP público que a API faz via REST (api.cloudflare.com).
[[d1_databases]]
binding = "DB"
database_name = "tutoriais-croche"
database_id = "020a20e7-829a-4df3-9e15-ed37949901b5"

[vars]
PINTEREST_BASE_URL = "https://www.pinterest.com"
PINTEREST_MAX_PAGES = "2"
PINTEREST_TIMEOUT_MS = "10000"
VALUESERP_SEARCH_TYPE = "images"
VALUESERP_GOOGLE_DOMAIN = "google.com.br"
VALUESERP_GL = "br"
VALUESERP_HL = "pt-br"
VALUESERP_TIME_PERIOD = "last_month"
VALUESERP_MAX_PAGES = "2"
VALUESERP_TIMEOUT_MS = "10000"
TRACKED_QUERIES_LIMIT = "5"
VALUESERP_DAILY_LIMIT = "200"

# Segredos - NUNCA colocar aqui. Configurar via:
#   wrangler secret put VALUESERP_API_KEY
#   wrangler secret put WORKER_ADMIN_KEY   (opcional, protege o endpoint manual /run)
